name: Repository validation

on:
  pull_request:
    paths:
      - "**.md"
      - ".github/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check required template files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f SECURITY.md
          test -f AGENTS.md
          test -f .editorconfig
          test -f .gitignore
          test -f .gitattributes
