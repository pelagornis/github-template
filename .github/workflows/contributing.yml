name: Repository validation

on:
  pull_request:
    paths:
      - "**.md"
      - ".github/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check required template files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f SECURITY.md
          test -f AGENTS.md
          test -f .editorconfig
          test -f .gitignore
          test -f .gitattributes
